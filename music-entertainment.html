<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b4bdb"><title>Silai Guru • Music & Entertainment</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f6f7fb;color:#202238}.wrap{max-width:760px;margin:auto;padding:16px 16px 30px}.hero{background:linear-gradient(135deg,#5b4bdb,#8267f5);color:white;padding:22px;border-radius:0 0 24px 24px}.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #20223812}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs button{padding:13px;border:0;border-radius:12px;font-weight:800;background:#efeeff;color:#5144bd}.tabs button.active{background:#5b4bdb;color:white}.note{font-size:12px;color:#73778c;line-height:1.5}.media{width:100%;margin-top:12px;border-radius:14px;background:#111}.filebtn{display:block;width:100%;padding:14px;border:1px solid #e5e6ef;border-radius:13px;background:white;font-weight:800}.item{width:100%;padding:14px;margin-top:8px;border:1px solid #e5e6ef;border-radius:13px;background:white;text-align:left}.item b{display:block}.item small{color:#73778c}.empty{padding:18px;text-align:center;color:#73778c;border:1px dashed #d8d9e5;border-radius:13px;margin-top:12px}</style></head><body><div class="hero"><div class="wrap"><h1>🎵 Music & Entertainment</h1><div>अपने phone के audio और video files सीधे चलाएँ</div></div></div><main class="wrap"><div class="card"><div class="tabs"><button id="mt" class="active">🎵 Music</button><button id="vt">🎬 Video</button></div></div><section id="music" class="card"><h2>🎵 Music Player</h2><p class="note">अपने phone में मौजूद audio files चुनें और इसी page पर चलाएँ।</p><input id="audioFiles" class="filebtn" type="file" accept="audio/*" multiple><audio id="audioPlayer" class="media" controls></audio><div id="audioList"></div></section><section id="videos" class="card" hidden><h2>🎬 Video Player</h2><p class="note">अपने phone की video files चुनें और इसी page पर चलाएँ। किसी website, API key या link की जरूरत नहीं।</p><input id="videoFiles" class="filebtn" type="file" accept="video/*" multiple><video id="videoPlayer" class="media" controls playsinline></video><div id="videoList"></div></section></main><script>const mt=document.getElementById('mt'),vt=document.getElementById('vt'),music=document.getElementById('music'),videos=document.getElementById('videos');mt.onclick=()=>{mt.classList.add('active');vt.classList.remove('active');music.hidden=false;videos.hidden=true};vt.onclick=()=>{vt.classList.add('active');mt.classList.remove('active');music.hidden=true;videos.hidden=false};function setup(inputId,listId,playerId,label){let urls=[];const input=document.getElementById(inputId),list=document.getElementById(listId),player=document.getElementById(playerId);input.onchange=e=>{urls.forEach(u=>URL.revokeObjectURL(u));urls=[];list.innerHTML='';const files=[...e.target.files];if(!files.length){list.innerHTML='<div class="empty">File select nahi hui.</div>';return}files.forEach((f,i)=>{const u=URL.createObjectURL(f);urls.push(u);const b=document.createElement('button');b.className='item';b.innerHTML='<b>'+label+' '+(i+1)+'</b><small>'+f.name+'</small>';b.onclick=()=>{player.src=u;player.play()};list.appendChild(b)});if(files[0]){player.src=urls[0]}}}setup('audioFiles','audioList','audioPlayer','🎵');setup('videoFiles','videoList','videoPlayer','🎬');</script></body></html>
