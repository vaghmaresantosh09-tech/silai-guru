<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b4bdb"><title>Silai Guru • Music & Entertainment</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f6f7fb;color:#202238}.wrap{max-width:760px;margin:auto;padding:16px 16px 30px}.hero{background:linear-gradient(135deg,#5b4bdb,#8267f5);color:white;padding:22px;border-radius:0 0 24px 24px}.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 18px #20223812}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs button{padding:13px;border:0;border-radius:12px;font-weight:800;background:#efeeff;color:#5144bd}.tabs button.active{background:#5b4bdb;color:white}.music{width:100%;padding:14px;margin-top:8px;border:1px solid #e5e6ef;border-radius:13px;background:white;text-align:left}.music b{display:block}.music small{color:#73778c}.video{position:relative;padding-top:56.25%;overflow:hidden;border-radius:14px;background:#111}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.note{font-size:12px;color:#73778c;line-height:1.5}</style></head><body><div class="hero"><div class="wrap"><h1>🎵 Music & Entertainment</h1><div>काम करते समय music सुनें या authorized videos देखें</div></div></div><main class="wrap"><div class="card"><div class="tabs"><button id="mt" class="active">🎵 Music</button><button id="vt">🎬 Videos</button></div></div><section id="music" class="card"><h2>🎵 Music Player</h2><p class="note">यहाँ अपने फोन की legally owned/royalty-free audio files चुनकर चला सकते हैं।</p><input id="files" type="file" accept="audio/*" multiple><audio id="player" controls style="width:100%;margin-top:12px"></audio><div id="list"></div></section><section id="videos" class="card" hidden><h2>🎬 Videos</h2><p class="note">Licensed/authorized video links ही इस्तेमाल करें। नीचे YouTube URL डालकर खोल सकते हैं।</p><input id="url" placeholder="YouTube video URL" style="width:100%;padding:12px;border:1px solid #e5e6ef;border-radius:11px"><button id="open" style="width:100%;margin-top:8px;padding:12px;border:0;border-radius:12px;background:#5b4bdb;color:#fff;font-weight:800">Open Video</button><div id="video" style="margin-top:12px"></div></section></main><script>const mt=document.getElementById('mt'),vt=document.getElementById('vt'),music=document.getElementById('music'),videos=document.getElementById('videos');mt.onclick=()=>{mt.classList.add('active');vt.classList.remove('active');music.hidden=false;videos.hidden=true};vt.onclick=()=>{vt.classList.add('active');mt.classList.remove('active');music.hidden=true;videos.hidden=false};let urls=[];document.getElementById('files').onchange=e=>{const list=document.getElementById('list'),p=document.getElementById('player');list.innerHTML='';urls.forEach(URL.revokeObjectURL);urls=[];[...e.target.files].forEach((f,i)=>{const u=URL.createObjectURL(f);urls.push(u);const b=document.createElement('button');b.className='music';b.innerHTML='<b>🎵 '+f.name+'</b><small>Tap to play</small>';b.onclick=()=>{p.src=u;p.play()};list.appendChild(b)})};document.getElementById('open').onclick=()=>{const u=document.getElementById('url').value.trim(),m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/))([^?&/]+)/);if(!m)return alert('Valid YouTube URL डालें');document.getElementById('video').innerHTML='<div class="video"><iframe src="https://www.youtube.com/embed/'+m[1]+'" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>'};</script></body></html>
