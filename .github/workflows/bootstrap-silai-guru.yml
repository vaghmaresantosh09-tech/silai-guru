name: Bootstrap Silai Guru

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-silai-guru.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Silai Guru
        uses: actions/checkout@v4

      - name: Copy latest Silai Guru files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          files=(
            'silai-guru.html'
            'silai-guru-backfix.js'
            'silai-guru-custom-measurements.js'
            'manifest.json'
            'sw.js'
            'index.html'
            '404.html'
            'icon-192.png'
            'icon-512.png'
          )
          for f in "${files[@]}"; do
            echo "Copying $f"
            curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/vaghmaresantosh09-tech/sharda-boutique/contents/$f?ref=main" \
              -o /tmp/file.json
            jq -r '.content' /tmp/file.json | tr -d '\n' | base64 --decode > "$f"
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add silai-guru.html silai-guru-backfix.js silai-guru-custom-measurements.js manifest.json sw.js index.html 404.html icon-192.png icon-512.png
          git commit -m 'Copy latest Silai Guru app from Sharda Boutique' || true
          git push
