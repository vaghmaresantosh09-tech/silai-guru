name: SILAI GURU final cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove retired script references
        shell: python
        run: |
          from pathlib import Path
          p=Path('silai-guru.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="silai-guru-backfix.js?v=20260404-1"></script><script src="silai-guru-custom-measurements.js?v=20260404-1"></script>'
          s=s.replace(old,'')
          s=s.replace('<script src="silai-guru-backfix.js?v=20261004-1"></script><script src="silai-guru-custom-measurements.js?v=20261004-1"></script>','')
          p.write_text(s,encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add silai-guru.html
          git diff --cached --quiet || git commit -m "Remove retired Silai Guru script references"
          git push || true
          rm -f .github/workflows/cleanup2.yml
          git add -u .github/workflows/cleanup2.yml
          git commit -m "Remove temporary cleanup workflow" || true
          git push || true
