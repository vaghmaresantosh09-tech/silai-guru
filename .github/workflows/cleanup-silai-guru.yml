name: SILAI GURU cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean legacy code and wire design viewer
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('silai-guru.html')
          s=p.read_text(encoding='utf-8')
          old=s
          s=re.sub(r'<script>\s*/\* SG_REAL_DESIGN_LIBRARY_V2 \*/.*?</script>\s*', '', s, flags=re.S)
          s=s.replace('<script src="./silai-guru-backfix.js?v=20261004-1"></script><script src="./silai-guru-custom-measurements.js?v=20261004-1"></script>', '')
          s=re.sub(r'<style id="sg-expanded-library-style">.*?</style>\s*<script id="sg-expanded-library-script">.*?</script>\s*<!-- SG_DESIGN_LIBRARY_EXPANDED_V1 -->\s*<!-- /SG_DESIGN_LIBRARY_EXPANDED_V1 -->\s*', '', s, flags=re.S)
          marker='<script src="./blouse-design-library.js?v=20261004-2"></script><script src="./profile-validation-v2.js?v=20261004-2"></script><script src="./silai-guru-order-ui.js?v=20261004-2"></script>'
          repl='<script src="./blouse-design-library.js?v=20261004-3"></script><script src="./profile-validation-v2.js?v=20261004-3"></script><script src="./silai-guru-order-ui.js?v=20261004-3"></script><script src="./silai-guru-order-design.js?v=20261004-3"></script>'
          if marker in s:
              s=s.replace(marker,repl,1)
          else:
              raise SystemExit('Expected script marker not found')
          if s==old:
              raise SystemExit('No cleanup changes made')
          p.write_text(s,encoding='utf-8')
      - name: Bump service worker cache version
        shell: python
        run: |
          from pathlib import Path
          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("CACHE='silai-guru-v69'", "CACHE='silai-guru-v70'")
          p.write_text(s,encoding='utf-8')
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace("./sw.js?v=64", "./sw.js?v=70").replace("silai-guru.html?v=64", "silai-guru.html?v=70")
          p.write_text(s,encoding='utf-8')
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add silai-guru.html sw.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Clean legacy Silai Guru code and fix design viewer loading"
          git push
      - name: Remove temporary workflow
        if: ${{ success() }}
        shell: bash
        run: |
          rm -f .github/workflows/cleanup-silai-guru.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/cleanup-silai-guru.yml
          git commit -m "Remove temporary cleanup workflow" || true
          git push || true
